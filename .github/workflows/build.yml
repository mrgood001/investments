name: Build

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --windowed --icon=assets/icon.png --add-data "assets:assets" --name BondCalculator main.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --icon=assets/icon.ico --add-data "assets;assets" --name BondCalculator main.py

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --onefile --windowed --icon=assets/icon.icns --add-data "assets:assets" --name BondCalculator main.py

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          mv dist/BondCalculator out/BondCalculator-linux

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          mv dist/BondCalculator.exe out/BondCalculator-windows.exe

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc dist/BondCalculator.app out/BondCalculator-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BondCalculator-${{ runner.os }}
          path: out/*
